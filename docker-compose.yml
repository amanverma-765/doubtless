services:
  init-permissions:
    image: alpine:latest
    user: "0:0"
    command:
      - /bin/sh
      - -c
      - |
        TARGET_UID="$${UID:-1000}"
        TARGET_GID="$${GID:-1000}"
        mkdir -p /cache/huggingface /cache/torch /app/data
        if [ "$$(stat -c '%u:%g' /cache)" != "$$TARGET_UID:$$TARGET_GID" ]; then
          chown -R "$$TARGET_UID:$$TARGET_GID" /cache
        else
          chown "$$TARGET_UID:$$TARGET_GID" /cache /cache/huggingface /cache/torch
        fi
        if [ "$$(stat -c '%u:%g' /app/data)" != "$$TARGET_UID:$$TARGET_GID" ]; then
          chown -R "$$TARGET_UID:$$TARGET_GID" /app/data
        fi
    volumes:
      - ./data:/app/data
      - model_cache:/cache
    restart: "no"

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    image: doubtless-backend:latest
    user: "${UID:-1000}:${GID:-1000}"
    command: /app/.venv/bin/doubtless api
    ports: ["8000:8000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: &backend_env
      HOME: /cache
      REDIS_URL: redis://redis:6379/0
      DOUBTLESS_DATA: /app/data
      HF_HOME: /cache/huggingface
      TORCH_HOME: /cache/torch
      HOST: 0.0.0.0
      PORT: 8000
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,*"
      AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:20128/v1}
      AI_MODEL_NAME: ${AI_MODEL_NAME:-cx/gpt-5.6-luna}
      NINEROUTER_API_KEY: ${NINEROUTER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_WHISPER_MODEL: ${GROQ_WHISPER_MODEL:-whisper-large-v3}
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
      LOGFIRE_ENVIRONMENT: ${LOGFIRE_ENVIRONMENT:-production}
      LOGFIRE_SEND_TO_LOGFIRE: ${LOGFIRE_SEND_TO_LOGFIRE:-if-token-present}
      LOGFIRE_SERVICE_NAME: ${LOGFIRE_SERVICE_NAME:-doubtless-api}
    volumes:
      - ./data:/app/data
      - model_cache:/cache
    depends_on:
      init-permissions:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    image: doubtless-backend:latest
    user: "${UID:-1000}:${GID:-1000}"
    command: /app/.venv/bin/doubtless worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *backend_env
      LOGFIRE_SERVICE_NAME: ${LOGFIRE_WORKER_SERVICE_NAME:-doubtless-worker}
    volumes:
      - ./data:/app/data
      - model_cache:/cache
    depends_on:
      init-permissions:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      api:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports: ["3000:3000"]
    depends_on:
      - api

volumes:
  model_cache:
