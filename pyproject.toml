[project]
name = "doubtless"
version = "1.0.0"
readme = "README.md"
description = "An interactive platform providing real-time doubt resolution across live and recorded video lectures."
requires-python = ">=3.14"
dependencies = [
    "celery>=5.6.3",
    "celery-types>=0.26.0",
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "ncert-cli>=1.0.3",
    "numpy==2.5.3",
    "pydantic>=2.13.5",
    "pydantic-ai>=2.40.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "redis>=8.1.0",
    "sentence-transformers>=5.0",
    "torch>=2.14.0",
    "transformers>=5.16.1",
]

[dependency-groups]
dev = ["ruff>=0.14", "mypy>=1.18"]

[project.scripts]
doubtless = "doubtless.main:main"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
files = ["src"]
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doubtless"]
