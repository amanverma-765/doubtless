services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    image: doubtless-backend:latest
    command: uv run --no-dev doubtless api
    ports: ["8000:8000"]
    environment: &backend_env
      REDIS_URL: redis://redis:6379/0
      DOUBTLESS_DATA: /app/data
      HOST: 0.0.0.0
      PORT: 8000
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,*"
      NINEROUTER_API_KEY: ${NINEROUTER_API_KEY}
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy

  worker:
    image: doubtless-backend:latest
    command: uv run --no-dev doubtless worker
    environment: *backend_env
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports: ["3000:3000"]
    depends_on:
      - api
