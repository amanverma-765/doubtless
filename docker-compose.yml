services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    image: doubtless-backend:latest
    user: "${UID:-1000}:${GID:-1000}"
    command: /app/.venv/bin/doubtless api
    ports: ["8000:8000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: &backend_env
      REDIS_URL: redis://redis:6379/0
      DOUBTLESS_DATA: /app/data
      HF_HOME: /cache/huggingface
      HOST: 0.0.0.0
      PORT: 8000
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,*"
      AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:20128/v1}
      AI_MODEL_NAME: ${AI_MODEL_NAME:-cx/gpt-5.6-luna}
      NINEROUTER_API_KEY: ${NINEROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
      LOGFIRE_ENVIRONMENT: ${LOGFIRE_ENVIRONMENT:-production}
      LOGFIRE_SEND_TO_LOGFIRE: ${LOGFIRE_SEND_TO_LOGFIRE:-if-token-present}
      LOGFIRE_SERVICE_NAME: ${LOGFIRE_SERVICE_NAME:-doubtless-api}
    volumes:
      - ./data:/app/data
      - huggingface_cache:/cache/huggingface
    depends_on:
      redis:
        condition: service_healthy

  worker:
    image: doubtless-backend:latest
    user: "${UID:-1000}:${GID:-1000}"
    command: /app/.venv/bin/doubtless worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *backend_env
      LOGFIRE_SERVICE_NAME: ${LOGFIRE_WORKER_SERVICE_NAME:-doubtless-worker}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./data:/app/data
      - huggingface_cache:/cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${DOCKER_GPU_COUNT:-all}
              capabilities: [gpu]
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports: ["3000:3000"]
    depends_on:
      - api

volumes:
  huggingface_cache:
